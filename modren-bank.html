<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10172a">
<title>Modren Bank</title>
<style>
:root{--bg:#08101f;--panel:#101a30;--panel2:#0b1427;--line:#263653;--text:#eef4ff;--muted:#9eacc5;--accent:#647cff;--good:#35c98a;--bad:#ff6678;--warn:#f5bd57;--shadow:0 18px 50px #0007}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1000px 600px at 50% -10%,#1d2d58 0,#08101f 60%);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:linear-gradient(180deg,#111d35,#0e172a);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login .card{width:min(520px,100%);padding:30px}.brand{font-size:38px;font-weight:800;letter-spacing:-1px}.sub{color:var(--muted);margin:7px 0 25px}
.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;background:#081123;border:1px solid #2b3b5c;color:var(--text);border-radius:12px;padding:12px 13px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:90px;resize:vertical}
.btn{padding:11px 15px;border-radius:12px;background:#263653;color:#fff}.btn:hover{filter:brightness(1.12)}.primary{background:var(--accent)}.danger{background:#8e2940}.good{background:#176d51}.warn{background:#77551e}.ghost{background:transparent;border:1px solid var(--line)}.small{padding:8px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:800px){.wrap{padding:12px}.g2,.g3,.g4{grid-template-columns:1fr}.brand{font-size:31px}.table{overflow-x:auto}}
.top{padding:14px 18px;position:sticky;top:0;z-index:5;background:#091225ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{display:flex;gap:7px;overflow:auto;padding:10px 0}.navbtn{white-space:nowrap;background:#0d1830;border:1px solid var(--line);color:#c9d4e8;border-radius:11px;padding:9px 12px}.navbtn.active{background:#33468e;border-color:#647cff;color:#fff}
h1,h2,h3{margin:0 0 12px}h2{font-size:21px}h3{font-size:16px}.muted{color:var(--muted)}.dangerText{color:var(--bad)}.goodText{color:var(--good)}
.stat{padding:17px}.stat .n{font-size:25px;font-weight:800}.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.section{padding:18px;margin:14px 0}.table{width:100%;overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #22314c;font-size:13px;vertical-align:top}.table th{color:#aebbd0}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#253451;color:#d9e3f6;font-size:12px}.badge.good{background:#124c3b}.badge.bad{background:#5b2130}.badge.warn{background:#59431d}
.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:#14233e;border:1px solid var(--line);padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);max-width:min(420px,90vw)}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:40}.modal .box{width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}
.kpi{font-size:30px;font-weight:800}.cardnum{font-family:ui-monospace,monospace;letter-spacing:2px}.divider{height:1px;background:var(--line);margin:15px 0}
.notice{padding:12px;border-radius:12px;background:#0a1930;border:1px solid #29436c;color:#cbd8ee}.warning{border-color:#735621;background:#2b2110}.empty{padding:30px;text-align:center;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;margin:7px 0}.check input{width:auto}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

/* Modren Bank — single-file edition.
   Data is stored in this browser by default.
   Backup/restore is built in so the whole bank can be moved as one JSON file.
   No old test accounts are included.
*/

const KEY="modren_bank_one_file_v1";
const SESSION="modren_bank_session_v1";

const DEFAULT={
  meta:{version:"1.0.0",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
  setup:{adminCreated:false},
  admin:null,
  accounts:[],
  currencies:[
    {id:"mod",code:"MOD",name:"Modren Coin",symbol:"MOD",decimals:2,active:true},
    {id:"gem",code:"GEM",name:"Gems",symbol:"💎",decimals:0,active:true}
  ],
  games:[
    {id:"modren-empire",name:"Modren Empire",description:"3D empire/company simulation game",active:true,createdAt:new Date().toISOString()}
  ],
  companies:[],
  products:[],
  transactions:[],
  debts:[],
  audit:[],
  settings:{
    bankName:"Modren Bank",
    allowUserTransfers:true,
    allowUserDeleteSelf:false,
    defaultCurrency:"MOD"
  }
};

let db=loadDB();
let session=loadSession();
let page="dashboard";
let toastTimer=null;

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadDB(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!x) return clone(DEFAULT);
    return Object.assign(clone(DEFAULT),x);
  }catch(e){return clone(DEFAULT)}
}
function saveDB(){db.meta.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db))}
function loadSession(){try{return JSON.parse(sessionStorage.getItem(SESSION)||"null")}catch(e){return null}}
function setSession(s){session=s;if(s)sessionStorage.setItem(SESSION,JSON.stringify(s));else sessionStorage.removeItem(SESSION);render()}
function uid(prefix="id"){return prefix+"_"+cryptoRandom()}
function cryptoRandom(){try{return crypto.randomUUID().replaceAll("-","").slice(0,14)}catch(e){return Math.random().toString(36).slice(2,16)}}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(n,d=2){return new Intl.NumberFormat("en-US",{maximumFractionDigits:d}).format(Number(n)||0)}
function now(){return new Date().toISOString()}
function getAccount(id){return db.accounts.find(a=>a.id===id)}
function getCurrency(code){return db.currencies.find(c=>c.code===code)}
function balance(a,code){return Number(a?.balances?.[code]||0)}
function isAdmin(){return session?.role==="admin"}
function isUser(){return session?.role==="user"}
function currentUser(){return isUser()?getAccount(session.accountId):null}
function log(action,details="",actor=null){
  db.audit.unshift({id:uid("audit"),at:now(),actor:actor||session?.username||"system",action,details});
  db.audit=db.audit.slice(0,1000);saveDB()
}
function toast(msg,type="info"){clearTimeout(toastTimer);let el=document.getElementById("toast");if(!el)return;el.textContent=msg;el.dataset.type=type;el.className="toast";toastTimer=setTimeout(()=>el.className="toast hidden",3000)}
function cardNumber(username){
  let h=0;for(const c of username){h=((h<<5)-h+c.charCodeAt(0))|0}
  let s=Math.abs(h).toString().padStart(12,"0").slice(-12);return "6288 "+s.match(/.{1,4}/g).join(" ")
}
function ensureBalances(a){a.balances=a.balances||{};db.currencies.forEach(c=>{if(a.balances[c.code]==null)a.balances[c.code]=0})}
function permission(a,gameId,key){
  return !!a?.permissions?.[gameId]?.[key]
}

function layout(content){
 return `<div class="app">
  <header class="top"><div class="row between">
    <div><strong>${esc(db.settings.bankName)}</strong><span class="muted"> · ${isAdmin()?"Administrator": "Account"}</span></div>
    <div class="row"><span class="badge">${esc(session?.username||"")}</span><button class="btn small ghost" onclick="logout()">Sign out</button></div>
  </div>
  <nav>${navItems().map(x=>`<button class="navbtn ${page===x.id?"active":""}" onclick="go('${x.id}')">${x.label}</button>`).join("")}</nav></header>
  <main class="wrap">${content}</main><div id="toast" class="toast hidden"></div>
 </div>`
}
function navItems(){
 if(isAdmin())return [
  {id:"dashboard",label:"Dashboard"},{id:"accounts",label:"Accounts"},{id:"games",label:"Games"},
  {id:"currencies",label:"Currencies"},{id:"shop",label:"Shop"},{id:"companies",label:"Companies"},
  {id:"transactions",label:"Transactions"},{id:"debts",label:"Debts"},{id:"audit",label:"Audit Log"},
  {id:"backup",label:"Backup & Settings"}
 ];
 return [{id:"dashboard",label:"Dashboard"},{id:"wallet",label:"Wallet"},{id:"shop",label:"Shop"},{id:"games",label:"Games"},{id:"transactions",label:"My Transactions"},{id:"settings",label:"Account"}]
}
function go(p){page=p;render()}

function render(){
 const root=document.getElementById("root");
 if(!session){root.innerHTML=loginHTML();return}
 root.innerHTML=layout(isAdmin()?adminPage():userPage());
}

function loginHTML(){
 if(!db.setup.adminCreated)return `<div class="login"><div class="card">
  <div class="brand">Modren Bank</div><div class="sub">First-run administrator setup</div>
  <div class="notice warning">No administrator exists yet. Create the administrator account now. This replaces the old hard-coded test login.</div>
  <form onsubmit="setupAdmin(event)">
   <div class="field"><label>Administrator username</label><input id="setupUser" required autocomplete="username"></div>
   <div class="field"><label>Administrator password</label><input id="setupPass" type="password" minlength="8" required autocomplete="new-password"></div>
   <div class="field"><label>Confirm password</label><input id="setupPass2" type="password" minlength="8" required autocomplete="new-password"></div>
   <button class="btn primary" style="width:100%">Create administrator</button>
  </form>
 </div></div>`;
 return `<div class="login"><div class="card">
  <div class="brand">Modren Bank</div><div class="sub">Virtual economy management</div>
  <form onsubmit="login(event)">
   <div class="field"><label>Username</label><input id="loginUser" required autocomplete="username"></div>
   <div class="field"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
   <button class="btn primary" style="width:100%">Sign in</button>
  </form>
  <div class="divider"></div><div class="muted" style="font-size:13px">Only the administrator can create user accounts.</div>
 </div></div>`;
}

async function setupAdmin(e){
 e.preventDefault();const u=document.getElementById("setupUser").value.trim(),p=document.getElementById("setupPass").value,p2=document.getElementById("setupPass2").value;
 if(p!==p2)return toast("Passwords do not match","error");
 db.admin={username:u,passwordHash:await sha256(p)};db.setup.adminCreated=true;saveDB();log("admin_created","Initial administrator created",u);
 setSession({role:"admin",username:u});toast("Administrator created","good")
}
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(e){
 e.preventDefault();const u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value,h=await sha256(p);
 if(db.admin&&u===db.admin.username&&h===db.admin.passwordHash){setSession({role:"admin",username:u});log("admin_login","Successful login",u);return}
 const a=db.accounts.find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.passwordHash===h);
 if(a){if(a.disabled)return toast("This account is disabled","error");a.lastLogin=now();saveDB();setSession({role:"user",username:a.username,accountId:a.id});log("user_login","Successful login",a.username);return}
 toast("Invalid username or password","error")
}
function logout(){if(session)log("logout","Session ended");setSession(null)}

function adminPage(){
 if(page==="accounts")return adminAccounts();
 if(page==="games")return adminGames();
 if(page==="currencies")return adminCurrencies();
 if(page==="shop")return adminShop();
 if(page==="companies")return adminCompanies();
 if(page==="transactions")return adminTransactions();
 if(page==="debts")return adminDebts();
 if(page==="audit")return adminAudit();
 if(page==="backup")return adminBackup();
 return adminDashboard();
}
function userPage(){
 if(page==="wallet")return userWallet();
 if(page==="shop")return userShop();
 if(page==="games")return userGames();
 if(page==="transactions")return userTransactions();
 if(page==="settings")return userSettings();
 return userDashboard();
}

function adminDashboard(){
 const balTotal=db.accounts.reduce((s,a)=>s+Object.values(a.balances||{}).reduce((x,n)=>x+Number(n||0),0),0);
 return `<div class="grid g4">
  <div class="card stat"><div class="n">${db.accounts.length}</div><div class="l">User accounts</div></div>
  <div class="card stat"><div class="n">${db.games.length}</div><div class="l">Games</div></div>
  <div class="card stat"><div class="n">${db.currencies.length}</div><div class="l">Currencies</div></div>
  <div class="card stat"><div class="n">${db.products.length}</div><div class="l">Products</div></div>
 </div>
 <section class="card section"><h2>Modren Bank</h2><p class="muted">Central management for virtual currencies, game accounts, permissions, purchases, companies, transactions and backups.</p>
 <div class="grid g3">
  <div class="notice"><b>Accounts</b><br>Admin-created user accounts with balances, Game IDs, permissions and Unlimited access.</div>
  <div class="notice"><b>Modren Empire</b><br>Game registration, player access and game-specific economy configuration.</div>
  <div class="notice"><b>Updates</b><br>Export a complete JSON backup before every change, then restore it if needed.</div>
 </div></section>
 <section class="card section"><h2>Quick actions</h2><div class="row">
 <button class="btn primary" onclick="go('accounts')">Manage accounts</button><button class="btn" onclick="go('games')">Manage games</button><button class="btn" onclick="go('currencies')">Manage currencies</button><button class="btn" onclick="go('backup')">Backup now</button></div></section>`
}

function adminAccounts(){
 return `<section class="card section"><div class="row between"><div><h2>User accounts</h2><div class="muted">Old test accounts are intentionally not included.</div></div><button class="btn primary" onclick="modalNewAccount()">+ Create account</button></div>
 <div class="table">${db.accounts.length?`<table><thead><tr><th>Username</th><th>Game ID</th><th>Balances</th><th>Status</th><th>Permissions</th><th>Actions</th></tr></thead><tbody>${db.accounts.map(accountRow).join("")}</tbody></table>`:`<div class="empty">No user accounts yet.</div>`}</div></section>`
}
function accountRow(a){
 ensureBalances(a);const games=Object.keys(a.gameIds||{}).length;
 return `<tr><td><b>${esc(a.username)}</b><br><span class="muted">${esc(a.displayName||"")}</span></td>
 <td>${games} game ID(s)<br><span class="muted">${esc(Object.values(a.gameIds||{}).join(", "))}</span></td>
 <td>${db.currencies.map(c=>`${esc(c.code)}: <b>${fmt(balance(a,c.code),c.decimals)}</b>`).join("<br>")}</td>
 <td>${a.disabled?'<span class="badge bad">Disabled</span>':'<span class="badge good">Active</span>'}</td>
 <td>${Object.values(a.permissions||{}).reduce((n,g)=>n+Object.values(g).filter(Boolean).length,0)} enabled</td>
 <td><div class="row"><button class="btn small" onclick="modalEditAccount('${a.id}')">Edit</button><button class="btn small" onclick="modalGrant('${a.id}')">Grant</button><button class="btn small warn" onclick="toggleAccount('${a.id}')">${a.disabled?"Enable":"Disable"}</button><button class="btn small danger" onclick="deleteAccount('${a.id}')">Delete</button></div></td></tr>`
}
function modalNewAccount(){
 modal(`<h2>Create user account</h2><form onsubmit="createAccount(event)">
 <div class="grid g2"><div class="field"><label>Username</label><input id="nu" required></div><div class="field"><label>Display name</label><input id="nd"></div></div>
 <div class="grid g2"><div class="field"><label>Password</label><input id="np" type="password" minlength="8" required></div><div class="field"><label>Initial Game ID</label><input id="ng" placeholder="Optional"></div></div>
 <button class="btn primary">Create</button></form>`)
}
async function createAccount(e){
 e.preventDefault();const u=nu.value.trim(),p=np.value,g=ng.value.trim();
 if(db.accounts.some(a=>a.username.toLowerCase()===u.toLowerCase()))return toast("Username already exists","error");
 const a={id:uid("acc"),username:u,displayName:nd.value.trim(),passwordHash:await sha256(p),createdAt:now(),lastLogin:null,disabled:false,balances:{},gameIds:{},permissions:{},unlimited:{},purchaseHistory:[]};
 ensureBalances(a);if(g)a.gameIds[db.games[0]?.id||"modren-empire"]=g;db.accounts.push(a);saveDB();log("account_created",u);closeModal();render();toast("Account created","good")
}
function modalEditAccount(id){
 const a=getAccount(id);if(!a)return;
 modal(`<h2>Edit ${esc(a.username)}</h2><form onsubmit="editAccount(event,'${id}')">
 <div class="field"><label>Display name</label><input id="ed" value="${esc(a.displayName||"")}"></div>
 <div class="field"><label>New password (leave blank to keep)</label><input id="ep" type="password" minlength="8"></div>
 <div class="field"><label>Notes</label><textarea id="en">${esc(a.notes||"")}</textarea></div>
 <button class="btn primary">Save</button></form>`)
}
async function editAccount(e,id){
 e.preventDefault();const a=getAccount(id);a.displayName=ed.value.trim();a.notes=en.value;if(ep.value)a.passwordHash=await sha256(ep.value);saveDB();log("account_updated",a.username);closeModal();render();toast("Account updated","good")
}
function toggleAccount(id){const a=getAccount(id);a.disabled=!a.disabled;saveDB();log("account_status_changed",`${a.username}: ${a.disabled}`);render()}
function deleteAccount(id){
 const a=getAccount(id);if(!a)return;
 if(!confirm(`Delete account "${a.username}" permanently? This removes its balances, permissions and purchase history.`))return;
 db.accounts=db.accounts.filter(x=>x.id!==id);db.transactions=db.transactions.filter(t=>t.from!==id&&t.to!==id);db.debts=db.debts.filter(d=>d.from!==id&&d.to!==id);saveDB();log("account_deleted",a.username);render();toast("Account deleted","good")
}
function modalGrant(id){
 const a=getAccount(id);
 modal(`<h2>Game permissions — ${esc(a.username)}</h2><div>${db.games.map(g=>{
 const p=a.permissions?.[g.id]||{};
 return `<div class="card section"><h3>${esc(g.name)}</h3>
 <label class="check"><input type="checkbox" id="p_${g.id}_open" ${p.open?"checked":""}> Can open game</label>
 <label class="check"><input type="checkbox" id="p_${g.id}_unlimited" ${p.unlimited?"checked":""}> Unlimited currency access</label>
 <label class="check"><input type="checkbox" id="p_${g.id}_shop" ${p.shop!==false?"checked":""}> Can use shop</label>
 <div class="field"><label>Game ID</label><input id="gid_${g.id}" value="${esc(a.gameIds?.[g.id]||"")}"></div></div>`
 }).join("")}</div><button class="btn primary" onclick="saveGrant('${id}')">Save permissions</button>`)
}
function saveGrant(id){
 const a=getAccount(id);db.games.forEach(g=>{a.permissions=a.permissions||{};a.permissions[g.id]={open:document.getElementById(`p_${g.id}_open`).checked,unlimited:document.getElementById(`p_${g.id}_unlimited`).checked,shop:document.getElementById(`p_${g.id}_shop`).checked};a.gameIds=a.gameIds||{};const v=document.getElementById(`gid_${g.id}`).value.trim();if(v)a.gameIds[g.id]=v;else delete a.gameIds[g.id]});
 saveDB();log("permissions_updated",a.username);closeModal();render();toast("Permissions saved","good")
}

function adminGames(){
 return `<section class="card section"><div class="row between"><div><h2>Games</h2><div class="muted">Game-specific IDs, permissions and economy links.</div></div><button class="btn primary" onclick="modalNewGame()">+ Add game</button></div>
 <div class="grid g2">${db.games.map(g=>`<div class="card section"><div class="row between"><div><h3>${esc(g.name)}</h3><div class="muted">${esc(g.description||"")}</div></div><span class="badge ${g.active?"good":"bad"}">${g.active?"Active":"Disabled"}</span></div><div class="divider"></div><div class="muted">ID: <b>${esc(g.id)}</b></div><div class="row" style="margin-top:10px"><button class="btn small" onclick="toggleGame('${g.id}')">${g.active?"Disable":"Enable"}</button><button class="btn small danger" onclick="deleteGame('${g.id}')">Delete</button></div></div>`).join("")}</div></section>`
}
function modalNewGame(){modal(`<h2>Add game</h2><form onsubmit="createGame(event)"><div class="grid g2"><div class="field"><label>Game ID</label><input id="gi" required pattern="[a-zA-Z0-9_-]+"></div><div class="field"><label>Name</label><input id="gn" required></div></div><div class="field"><label>Description</label><textarea id="gd"></textarea></div><button class="btn primary">Add game</button></form>`)}
function createGame(e){e.preventDefault();if(db.games.some(g=>g.id===gi.value.trim()))return toast("Game ID already exists","error");db.games.push({id:gi.value.trim(),name:gn.value.trim(),description:gd.value.trim(),active:true,createdAt:now()});saveDB();log("game_created",gi.value);closeModal();render()}
function toggleGame(id){const g=db.games.find(x=>x.id===id);g.active=!g.active;saveDB();log("game_status_changed",g.name);render()}
function deleteGame(id){if(id==="modren-empire")return toast("Keep Modren Empire as the primary game","error");if(!confirm("Delete this game?"))return;db.games=db.games.filter(g=>g.id!==id);saveDB();log("game_deleted",id);render()}

function adminCurrencies(){
 return `<section class="card section"><div class="row between"><div><h2>Currencies</h2><div class="muted">Virtual currencies only. No real-money banking.</div></div><button class="btn primary" onclick="modalNewCurrency()">+ Add currency</button></div>
 <div class="table"><table><thead><tr><th>Code</th><th>Name</th><th>Symbol</th><th>Decimals</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.currencies.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.name)}</td><td>${esc(c.symbol)}</td><td>${c.decimals}</td><td><span class="badge ${c.active?"good":"bad"}">${c.active?"Active":"Disabled"}</span></td><td><button class="btn small" onclick="toggleCurrency('${c.id}')">${c.active?"Disable":"Enable"}</button></td></tr>`).join("")}</tbody></table></div></section>`
}
function modalNewCurrency(){modal(`<h2>Add currency</h2><form onsubmit="createCurrency(event)"><div class="grid g2"><div class="field"><label>Code</label><input id="cc" required maxlength="8" pattern="[A-Za-z0-9_-]+"></div><div class="field"><label>Name</label><input id="cn" required></div></div><div class="grid g2"><div class="field"><label>Symbol</label><input id="cs" required></div><div class="field"><label>Decimal places</label><input id="cd" type="number" min="0" max="6" value="2"></div></div><button class="btn primary">Create</button></form>`)}
function createCurrency(e){e.preventDefault();const code=cc.value.trim().toUpperCase();if(db.currencies.some(c=>c.code===code))return toast("Currency code already exists","error");db.currencies.push({id:uid("cur"),code,name:cn.value.trim(),symbol:cs.value.trim(),decimals:Number(cd.value),active:true});db.accounts.forEach(ensureBalances);saveDB();log("currency_created",code);closeModal();render()}
function toggleCurrency(id){const c=db.currencies.find(x=>x.id===id);c.active=!c.active;saveDB();log("currency_status_changed",c.code);render()}

function modalNewProduct(){modal(`<h2>Add shop product</h2><form onsubmit="createProduct(event)">

 <div class="field"><label>Stock (-1 = unlimited)</label><input id="ps" type="number" value="-1"></div><button class="btn primary">Create</button></form>`)}
function createProduct(e){e.preventDefault();db.products.push({id:uid("prod"),name:pn.value.trim(),description:px.value.trim(),gameId:pg.value,currency:pc.value,price:Number(pp.value),stock:Number(ps.value),active:true,createdAt:now()});saveDB();log("product_created",pn.value);closeModal();render()}
function toggleProduct(id){const p=db.products.find(x=>x.id===id);p.active=!p.active;saveDB();render()}

function adminCompanies(){
 return `<section class="card section"><div class="row between"><div><h2>Companies</h2><div class="muted">Company records used by Modren Empire / Modren economy systems.</div></div><button class="btn primary" onclick="modalNewCompany()">+ Add company</button></div>
 <div class="grid g2">${db.companies.length?db.companies.map(c=>`<div class="card section"><h3>${esc(c.name)}</h3><div class="muted">Owner: ${esc(getAccount(c.ownerId)?.username||"—")}</div><div class="muted">Sector: ${esc(c.sector||"—")}</div><div class="muted">Level: ${c.level||1} · Budget: ${fmt(c.budget||0)}</div><div class="row" style="margin-top:10px"><button class="btn small danger" onclick="deleteCompany('${c.id}')">Delete</button></div></div>`).join(""):`<div class="empty">No companies registered yet.</div>`}</div></section>`

function modalNewCompany(){modal(`<h2>Add company</h2><form onsubmit="createCompany(event)"><div class="grid g2"><div class="field"><label>Company name (English)</label><input id="co" required></div><div class="field"><label>Owner account</label><select id="cw"><option value="">Unassigned</option>${db.accounts.map(a=>`<option value="${a.id}">${esc(a.username)}</option>`).join("")}</select></div></div><div class="grid g3"><div class="field"><label>Sector</label><input id="ct" placeholder="Electronics, software, manufacturing..."></div><div class="field"><label>Level</label><input id="cl" type="number" min="1" value="1"></div><div class="field"><label>Budget</label><input id="cb" type="number" min="0" value="0"></div></div><button class="btn primary">Create</button></form>`)}

function adminTransactions(){
 return `<section class="card section"><div class="row between"><div><h2>Transactions</h2><div class="muted">Every transfer, grant, purchase and reversal is recorded.</div></div><button class="btn primary" onclick="modalGrantCurrency()">+ Grant currency</button></div>
 <div class="table">${db.transactions.length?`<table><thead><tr><th>Time</th><th>Type</th><th>From</th><th>To</th><th>Amount</th><th>Details</th></tr></thead><tbody>${db.transactions.slice(0,300).map(t=>`<tr><td>${esc(new Date(t.at).toLocaleString())}</td><td>${esc(t.type)}</td><td>${esc(getAccount(t.from)?.username||t.from||"Bank")}</td><td>${esc(getAccount(t.to)?.username||t.to||"Bank")}</td><td>${fmt(t.amount)} ${esc(t.currency)}</td><td>${esc(t.details||"")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No transactions.</div>`}</div></section>`
}
function modalGrantCurrency(){modal(`<h2>Grant currency</h2><form onsubmit="grantCurrency(event)"><div class="grid g3"><div class="field"><label>Account</label><select id="ga">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.username)}</option>`).join("")}</select></div><div class="field"><label>Currency</label><select id="gc">${db.currencies.map(c=>`<option value="${c.code}">${esc(c.code)}</option>`).join("")}</select></div><div class="field"><label>Amount</label><input id="gm" type="number" min="0" step="any" required></div></div><div class="field"><label>Reason</label><input id="gr" placeholder="Admin grant"></div><button class="btn primary">Grant</button></form>`)}
function grantCurrency(e){e.preventDefault();const a=getAccount(ga.value),c=gc.value,n=Number(gm.value);ensureBalances(a);a.balances[c]+=n;db.transactions.unshift({id:uid("tx"),at:now(),type:"grant",from:null,to:a.id,amount:n,currency:c,details:gr.value});saveDB();log("currency_granted",`${a.username} +${n} ${c}`);closeModal();render();toast("Currency granted","good")}

function adminDebts(){
 return `<section class="card section"><div class="row between"><div><h2>Debts</h2><div class="muted">Optional virtual debt records.</div></div><button class="btn primary" onclick="modalNewDebt()">+ Add debt</button></div>
 <div class="table">${db.debts.length?`<table><thead><tr><th>From</th><th>To</th><th>Amount</th><th>Status</th><th>Due</th><th>Actions</th></tr></thead><tbody>${db.debts.map(d=>`<tr><td>${esc(getAccount(d.from)?.username||"—")}</td><td>${esc(getAccount(d.to)?.username||"—")}</td><td>${fmt(d.amount)} ${esc(d.currency)}</td><td>${esc(d.status)}</td><td>${esc(d.due||"—")}</td><td><button class="btn small" onclick="settleDebt('${d.id}')">Settle</button> <button class="btn small danger" onclick="deleteDebt('${d.id}')">Delete</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No debts.</div>`}</div></section>`
}
function modalNewDebt(){modal(`<h2>Add debt</h2><form onsubmit="createDebt(event)"><div class="grid g2"><div class="field"><label>Borrower</label><select id="df">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.username)}</option>`).join("")}</select></div><div class="field"><label>Creditor</label><select id="dt">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.username)}</option>`).join("")}</select></div></div><div class="grid g3"><div class="field"><label>Currency</label><select id="dc">${db.currencies.map(c=>`<option value="${c.code}">${esc(c.code)}</option>`).join("")}</select></div><div class="field"><label>Amount</label><input id="da" type="number" min="0" step="any" required></div><div class="field"><label>Due date</label><input id="dd" type="date"></div></div><button class="btn primary">Create debt</button></form>`)}
function createDebt(e){e.preventDefault();if(df.value===dt.value)return toast("Borrower and creditor must differ","error");db.debts.unshift({id:uid("debt"),from:df.value,to:dt.value,currency:dc.value,amount:Number(da.value),due:dd.value,status:"open",createdAt:now()});saveDB();log("debt_created",`${df.value}->${dt.value}`);closeModal();render()}
function settleDebt(id){const d=db.debts.find(x=>x.id===id);if(d){d.status="settled";d.settledAt=now();saveDB();log("debt_settled",id);render()}}
function deleteDebt(id){if(confirm("Delete debt record?")){db.debts=db.debts.filter(x=>x.id!==id);saveDB();render()}}

function adminAudit(){
 return `<section class="card section"><div class="row between"><div><h2>Audit log</h2><div class="muted">Administrative and account activity.</div></div><button class="btn small danger" onclick="clearAudit()">Clear log</button></div><div class="table"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>${db.audit.slice(0,500).map(x=>`<tr><td>${esc(new Date(x.at).toLocaleString())}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td>${esc(x.details)}</td></tr>`).join("")}</tbody></table></div></section>`
}
function clearAudit(){if(confirm("Clear audit log?")){db.audit=[];saveDB();render()}}

function adminBackup(){
 return `<section class="card section"><h2>Backup, restore & settings</h2>
 <div class="notice">Use <b>Export backup</b> before changing the bank. The backup contains accounts, currencies, games, companies, shop, transactions, debts, settings and audit data.</div>
 <div class="row" style="margin-top:14px"><button class="btn primary" onclick="exportBackup()">Export backup JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">Restore backup</button><input id="restoreFile" class="hidden" type="file" accept=".json,application/json" onchange="restoreBackup(event)"></div>
 <div class="divider"></div>
 <form onsubmit="saveSettings(event)"><div class="grid g2">
  <div class="field"><label>Bank name</label><input id="bn" value="${esc(db.settings.bankName)}"></div>
  <div class="field"><label>Default currency</label><select id="bd">${db.currencies.map(c=>`<option value="${c.code}" ${db.settings.defaultCurrency===c.code?"selected":""}>${esc(c.code)}</option>`).join("")}</select></div>
 </div>
 <label class="check"><input id="bt" type="checkbox" ${db.settings.allowUserTransfers?"checked":""}> Allow user-to-user transfers</label>
 <label class="check"><input id="bs" type="checkbox" ${db.settings.allowUserDeleteSelf?"checked":""}> Allow users to delete their own accounts</label>
 <button class="btn primary">Save settings</button></form>
 <div class="divider"></div><h3>Reset</h3><p class="muted">This removes all current local bank data and returns to first-run administrator setup.</p><button class="btn danger" onclick="factoryReset()">Factory reset</button>
 </section>`
}
function saveSettings(e){e.preventDefault();db.settings.bankName=bn.value.trim()||"Modren Bank";db.settings.defaultCurrency=bd.value;db.settings.allowUserTransfers=bt.checked;db.settings.allowUserDeleteSelf=bs.checked;saveDB();log("settings_updated","Bank settings");render();toast("Settings saved","good")}
function exportBackup(){
 const data=JSON.stringify({format:"Modren Bank backup",version:db.meta.version,exportedAt:now(),data:db},null,2);
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="Modren-Bank-Backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href);log("backup_exported","Full local backup")
}
function restoreBackup(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const incoming=x.data||x;if(!incoming.accounts||!incoming.currencies||!incoming.games)throw Error("Invalid backup");if(!confirm("Replace all current bank data with this backup?"))return;db=incoming;saveDB();setSession(null);alert("Backup restored. Sign in again.");}catch(err){toast("Invalid backup file","error")}};r.readAsText(f)
}
function factoryReset(){if(confirm("FACTORY RESET: permanently erase all local bank data?")){localStorage.removeItem(KEY);sessionStorage.removeItem(SESSION);db=clone(DEFAULT);session=null;render()}}

function userDashboard(){
 const a=currentUser();ensureBalances(a);
 return `<section class="card section"><div class="row between"><div><h2>Welcome, ${esc(a.displayName||a.username)}</h2><div class="muted">Game ID(s): ${esc(Object.values(a.gameIds||{}).join(", ")||"Not assigned")}</div></div><span class="badge good">Active</span></div>
 <div class="grid g3">${db.currencies.filter(c=>c.active).map(c=>`<div class="card stat"><div class="n">${fmt(balance(a,c.code),c.decimals)} ${esc(c.symbol||c.code)}</div><div class="l">${esc(c.name)} · ${esc(c.code)}</div></div>`).join("")}</div></section>
 <section class="card section"><h2>Games</h2>${db.games.filter(g=>g.active).map(g=>`<div class="row between notice" style="margin:8px 0"><div><b>${esc(g.name)}</b><br><span class="muted">${permission(a,g.id,"open")?"Access granted":"Access not granted"}</span></div><button class="btn small" onclick="go('games')">Open details</button></div>`).join("")}</section>`
}
function userWallet(){
 const a=currentUser();ensureBalances(a);
 return `<section class="card section"><h2>Wallet</h2><div class="grid g2">${db.currencies.filter(c=>c.active).map(c=>`<div class="card section"><h3>${esc(c.name)} (${esc(c.code)})</h3><div class="kpi">${fmt(balance(a,c.code),c.decimals)}</div><div class="muted">${esc(c.symbol)}</div></div>`).join("")}</div>
 ${db.settings.allowUserTransfers?`<button class="btn primary" onclick="modalTransfer()">Send currency</button>`:""}</section>`
}
function modalTransfer(){
 const a=currentUser();modal(`<h2>Send currency</h2><form onsubmit="transfer(event)"><div class="grid g3"><div class="field"><label>Recipient</label><select id="ta">${db.accounts.filter(x=>x.id!==a.id&&!x.disabled).map(x=>`<option value="${x.id}">${esc(x.username)}</option>`).join("")}</select></div><div class="field"><label>Currency</label><select id="tc">${db.currencies.filter(c=>c.active).map(c=>`<option value="${c.code}">${esc(c.code)}</option>`).join("")}</select></div><div class="field"><label>Amount</label><input id="tm" type="number" min="0.000001" step="any" required></div></div><div class="field"><label>Note</label><input id="tn"></div><button class="btn primary">Send</button></form>`)
}
function transfer(e){
 e.preventDefault();const from=currentUser(),to=getAccount(ta.value),c=tc.value,n=Number(tm.value);ensureBalances(from);ensureBalances(to);
 if(n<=0||balance(from,c)<n)return toast("Insufficient balance","error");
 from.balances[c]-=n;to.balances[c]+=n;db.transactions.unshift({id:uid("tx"),at:now(),type:"transfer",from:from.id,to:to.id,amount:n,currency:c,details:tn.value});saveDB();log("transfer",`${from.username} -> ${to.username}: ${n} ${c}`,from.username);closeModal();render();toast("Transfer completed","good")
}
function userShop(){
 const a=currentUser();
 return `<section class="card section"><h2>Shop</h2><div class="grid g2">${db.products.filter(p=>p.active).map(p=>{
 const g=db.games.find(x=>x.id===p.gameId),allowed=permission(a,p.gameId,"shop");const c=getCurrency(p.currency);
 return `<div class="card section"><div class="row between"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description||"")}</div></div><span class="badge">${fmt(p.price,c?.decimals||2)} ${esc(p.currency)}</span></div><div class="muted">Game: ${esc(g?.name||p.gameId)}</div><button class="btn primary" style="margin-top:12px" ${allowed?"":"disabled"} onclick="buyProduct('${p.id}')">${allowed?"Purchase":"Shop access disabled"}</button></div>`
 }).join("")||`<div class="empty">No products available.</div>`}</div></section>`
}
function buyProduct(id){
 const a=currentUser(),p=db.products.find(x=>x.id===id),c=getCurrency(p.currency);ensureBalances(a);
 if(!permission(a,p.gameId,"shop"))return toast("You do not have shop permission","error");
 if(p.stock===0)return toast("Out of stock","error");
 if(balance(a,p.currency)<p.price)return toast("Insufficient balance","error");
 a.balances[p.currency]-=p.price;if(p.stock>0)p.stock--;a.purchaseHistory=a.purchaseHistory||[];a.purchaseHistory.unshift({id:uid("pur"),at:now(),productId:p.id,price:p.price,currency:p.currency});
 db.transactions.unshift({id:uid("tx"),at:now(),type:"purchase",from:a.id,to:null,amount:p.price,currency:p.currency,details:p.name});saveDB();log("purchase",`${a.username}: ${p.name}`,a.username);render();toast("Purchase completed","good")
}
function userGames(){
 const a=currentUser();return `<section class="card section"><h2>My games</h2><div class="grid g2">${db.games.filter(g=>g.active).map(g=>{
 const p=a.permissions?.[g.id]||{},gid=a.gameIds?.[g.id]||"Not assigned";
 return `<div class="card section"><h3>${esc(g.name)}</h3><p class="muted">${esc(g.description||"")}</p><div class="notice">Game ID: <b>${esc(gid)}</b><br>Open: ${p.open?"Yes":"No"} · Shop: ${p.shop!==false?"Yes":"No"} · Unlimited: ${p.unlimited?"Yes":"No"}</div></div>`
 }).join("")}</div></section>`
}
function userTransactions(){
 const a=currentUser(),rows=db.transactions.filter(t=>t.from===a.id||t.to===a.id).slice(0,200);
 return `<section class="card section"><h2>My transactions</h2><div class="table">${rows.length?`<table><thead><tr><th>Time</th><th>Type</th><th>Direction</th><th>Amount</th><th>Details</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(new Date(t.at).toLocaleString())}</td><td>${esc(t.type)}</td><td>${t.to===a.id?"Received":"Sent"}</td><td>${fmt(t.amount)} ${esc(t.currency)}</td><td>${esc(t.details||"")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No transactions.</div>`}</div></section>`
}
function userSettings(){
 const a=currentUser();return `<section class="card section"><h2>Account</h2><div class="notice"><b>${esc(a.username)}</b><br>Card: <span class="cardnum">${esc(a.cardNumber||cardNumber(a.username))}</span><br>Created: ${esc(new Date(a.createdAt).toLocaleString())}</div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="modalChangePassword()">Change password</button>${db.settings.allowUserDeleteSelf?`<button class="btn danger" onclick="selfDeleteAccount()">Delete account</button>`:""}</div></section>`
}
function modalChangePassword(){modal(`<h2>Change password</h2><form onsubmit="changePassword(event)"><div class="field"><label>Current password</label><input id="op" type="password" required></div><div class="field"><label>New password</label><input id="cp" type="password" minlength="8" required></div><button class="btn primary">Change password</button></form>`)}
async function changePassword(e){e.preventDefault();const a=currentUser();if(await sha256(op.value)!==a.passwordHash)return toast("Current password is incorrect","error");a.passwordHash=await sha256(cp.value);saveDB();log("password_changed",a.username,a.username);closeModal();toast("Password changed","good")}
function selfDeleteAccount(){const a=currentUser();if(!confirm(`Delete your account "${a.username}" permanently?`))return;db.accounts=db.accounts.filter(x=>x.id!==a.id);db.transactions=db.transactions.filter(t=>t.from!==a.id&&t.to!==a.id);saveDB();log("account_self_deleted",a.username,a.username);setSession(null)}

function modal(inner){document.body.insertAdjacentHTML("beforeend",`<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="box card">${inner}<div style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">Close</button></div></div></div>`)}
function closeModal(){document.getElementById("modal")?.remove()}

window.setupAdmin=setupAdmin;window.login=login;window.logout=logout;window.go=go;window.modalNewAccount=modalNewAccount;window.createAccount=createAccount;window.modalEditAccount=modalEditAccount;window.editAccount=editAccount;window.toggleAccount=toggleAccount;window.deleteAccount=deleteAccount;window.modalGrant=modalGrant;window.saveGrant=saveGrant;window.modalNewGame=modalNewGame;window.createGame=createGame;window.toggleGame=toggleGame;window.deleteGame=deleteGame;window.modalNewCurrency=modalNewCurrency;window.createCurrency=createCurrency;window.toggleCurrency=toggleCurrency;window.modalNewProduct=modalNewProduct;window.createProduct=createProduct;window.toggleProduct=toggleProduct;window.deleteProduct=deleteProduct;window.modalNewCompany=modalNewCompany;window.createCompany=createCompany;window.deleteCompany=deleteCompany;window.modalGrantCurrency=modalGrantCurrency;window.grantCurrency=grantCurrency;window.modalNewDebt=modalNewDebt;window.createDebt=createDebt;window.settleDebt=settleDebt;window.deleteDebt=deleteDebt;window.clearAudit=clearAudit;window.saveSettings=saveSettings;window.exportBackup=exportBackup;window.restoreBackup=restoreBackup;window.factoryReset=factoryReset;window.modalTransfer=modalTransfer;window.transfer=transfer;window.buyProduct=buyProduct;window.modalChangePassword=modalChangePassword;window.changePassword=changePassword;window.selfDeleteAccount=selfDeleteAccount;window.closeModal=closeModal;

render();
